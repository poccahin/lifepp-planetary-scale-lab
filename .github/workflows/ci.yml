name: scale-lab-determinism

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: github-ubuntu-x64
          - runner: macos-14
            platform: github-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scale-evidence-${{ matrix.platform }}
          path: reports
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: reproduce
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scale-evidence-github-ubuntu-x64
          path: artifacts/ubuntu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scale-evidence-github-macos-arm64
          path: artifacts/macos
      - name: Require every report artifact to be byte-identical
        run: diff -ru artifacts/ubuntu artifacts/macos
      - run: node scripts/compare-build-platforms.mjs artifacts/ubuntu/planetary-scale-evidence-certificate.json artifacts/macos/planetary-scale-evidence-certificate.json
